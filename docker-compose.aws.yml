version: "3.9"

services:

  backend:

    build:
      context: ./backend

    container_name: backend

    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - backend/.env

    healthcheck:
      test: ["CMD","curl","-f","http://localhost:5000/status"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:

    build:
      context: ./frontend

    container_name: frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend