version: "3.9"

services:

  backend:

    build:
      context: ./backend

    container_name: backend

    restart: unless-stopped

    env_file:
      - backend/.env

    ports:
      - "5000:5000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/app-status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - app-network

  frontend:

    build:
      context: ./frontend

    container_name: frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_started

    networks:
      - app-network

networks:
  app-network:
    driver: bridge