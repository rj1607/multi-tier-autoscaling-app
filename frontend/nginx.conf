server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {

        try_files $uri $uri/ /index.html;

    }

    location /app-status {

        proxy_pass http://backend:5000/app-status;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

    }

    location /products {

        proxy_pass http://backend:5000/products;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

    }

}